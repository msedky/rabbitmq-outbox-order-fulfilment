apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-order
  namespace: rabbitmq-outbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-order
  template:
    metadata:
      labels:
        app: postgres-order
    spec:
      containers:
        - name: postgres-order
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-order-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-order-secret
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-order
  namespace: rabbitmq-outbox
spec:
  selector:
    app: postgres-order
  ports:
    - port: 5432
      targetPort: 5432